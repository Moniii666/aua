<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Прогноз погоды</title>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(to right, #6faadd, #00f2fe);
            color: white;
            text-align: center;
        }
        .container {
            background: rgba(255, 255, 255, 0.2);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
        }
        input {
            padding: 10px;
            font-size: 18px;
            border: none;
            border-radius: 8px;
            outline: none;
            width: 250px;
            margin-bottom: 10px;
        }
        button {
            padding: 12px 20px;
            font-size: 18px;
            border: none;
            border-radius: 8px;
            background: #ff512f;
            color: white;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover {
            background: #dd2476;
        }
        #weather {
            margin-top: 20px;
            font-size: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Прогноз погоды</h1>
        <input type="text" id="city" placeholder="Введите город">
        <br>
        <button onclick="getWeather()">Получить погоду</button>
        <div id="weather"></div>
    </div>

    <script>
        async function getWeather() {
            const city = document.getElementById('city').value;
            const apiKey = 'b7b8b1864df2e39d4b46bacb7c84c09d'; // Замените на ваш API ключ OpenWeather
            const url = `https://api.openweathermap.org/data/2.5/weather?q=${city}&units=metric&lang=ru&appid=${apiKey}`;

            try {
                const response = await fetch(url);
                const data = await response.json();

                if (data.cod === 200) {
                    document.getElementById('weather').innerHTML = `
                        <p><strong>Город:</strong> ${data.name}</p>
                        <p><strong>Температура:</strong> ${data.main.temp}°C</p>
                        <p><strong>Погодные условия:</strong> ${data.weather[0].description}</p>
                    `;
                } else {
                    document.getElementById('weather').innerHTML = '<p style="color: #ffcccb;">Город не найден</p>';
                }
            } catch (error) {
                document.getElementById('weather').innerHTML = '<p style="color: #ffcccb;">Ошибка при получении данных</p>';
            }
        }
    </script>
</body>
</html>
